<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden}
svg{position:absolute;inset:0}
#label{position:absolute;top:70px;left:60px;color:#d6d9e6;font:800 36px/1 "Inter";letter-spacing:.14em}
#label:before{content:"";display:inline-block;width:16px;height:16px;border-radius:50%;background:#e5484d;margin-right:16px;vertical-align:middle;position:relative;top:-3px}
#cap{position:absolute;left:50px;right:50px;top:1500px;text-align:center;font:900 90px/1.08 "Inter";text-transform:uppercase;color:#fff;
 paint-order:stroke fill;-webkit-text-stroke:14px #05060a}
#cap span{display:inline-block;margin:0 .13em}
#cap .acc{color:#ffd23f}
#bar{position:absolute;left:0;bottom:0;height:10px;background:#e5484d}
</style></head>
<body><div id="stage"><svg id="svg" viewBox="0 0 1080 1920"></svg><div id="label"></div><div id="cap"></div><div id="bar"></div></div>
<script>
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const noise=t=>Math.sin(t*13.1)*Math.sin(t*7.3+1)*Math.sin(t*3.7+2);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const VIGNETTE=`<defs><radialGradient id="vg" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient></defs>`;

function person(p,lt,T,floor){
 const s=p.scale||1,bob=Math.sin(T*2.4+p.x)*3,x=p.x,dark=p.dark;
 const skin=dark?'#0a0b10':'#e8c2a4', shirt=dark?'#0a0b10':(p.shirt||'#4b5a8a');
 const eyes=dark?(p.eyes?`<circle cx="-28" cy="-8" r="9" fill="#f2f2f2"/><circle cx="28" cy="-8" r="9" fill="#f2f2f2"/>`:''):
  (p.mood==='shock'?`<ellipse cx="-30" cy="-10" rx="18" ry="24" fill="#fff" stroke="#111" stroke-width="4"/><ellipse cx="30" cy="-10" rx="18" ry="24" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="-30" cy="-8" r="6"/><circle cx="30" cy="-8" r="6"/><ellipse cx="0" cy="48" rx="13" ry="17" fill="#4a1717"/>`
  :`<ellipse cx="-30" cy="-10" rx="17" ry="20" fill="#fff" stroke="#111" stroke-width="4"/><ellipse cx="30" cy="-10" rx="17" ry="20" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="-28" cy="-6" r="8"/><circle cx="32" cy="-6" r="8"/><path d="M-48 -44 L-14 -36 M48 -44 L14 -36" stroke="#111" stroke-width="6" stroke-linecap="round"/><path d="M-16 48 Q0 40 16 48" stroke="#111" stroke-width="5" fill="none"/>`);
 const hair=dark?'':(p.hair==='long'?`<path d="M-80 -20 Q-90 -110 0 -112 Q90 -110 80 -20 L84 90 L56 90 L58 -40 Q0 -70 -58 -40 L-56 90 L-84 90Z" fill="#3b2a20"/>`:`<path d="M-78 -30 Q-80 -110 0 -110 Q80 -110 78 -30 Q40 -70 -78 -30Z" fill="#1d1d24"/>`);
 return `<g transform="translate(${x} ${floor}) scale(${s})" opacity="${p.op??1}">
  <rect x="-48" y="-200" width="38" height="200" rx="16" fill="${dark?'#0a0b10':'#262c40'}"/><rect x="10" y="-200" width="38" height="200" rx="16" fill="${dark?'#0a0b10':'#262c40'}"/>
  <g transform="translate(0 ${bob})"><rect x="-80" y="-430" width="160" height="250" rx="50" fill="${shirt}"/>
  <rect x="-112" y="-410" width="40" height="190" rx="20" fill="${shirt}"/><rect x="72" y="-410" width="40" height="190" rx="20" fill="${shirt}"/>
  <g transform="translate(0 -540)"><circle r="96" fill="${skin}"/>${hair}<g fill="#111">${eyes}</g></g></g></g>`;
}

const SC={
 facade(sc,lt,T){
  const rows=sc.floors||9, cols=4, lit=new Set(sc.lit||[]), hl=sc.highlight;
  let w='';let n=1;
  for(let r=rows-1;r>=0;r--)for(let c=0;c<cols;c++){const k=n++;const x=230+c*165,y=330+r*105;
   const on=lit.has(k)||k===hl, f=k===hl?0.75+0.25*Math.abs(noise(T)):1;
   w+=`<rect x="${x}" y="${y}" width="120" height="70" fill="${on?`rgba(255,210,110,${f})`:'#141a2c'}"/>`;
   if(k===hl)w+=`<rect x="${x-8}" y="${y-8}" width="136" height="86" fill="none" stroke="#e5484d" stroke-width="6"/><text x="${x+60}" y="${y-22}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="54" fill="#e5484d">${esc(sc.hlLabel||'')}</text>`;}
  return `<rect width="1080" height="1920" fill="#070912"/>${[...Array(40)].map((_,i)=>`<circle cx="${(i*263)%1080}" cy="${(i*131)%300+40}" r="2" fill="#fff" opacity=".5"/>`).join('')}
   <rect x="190" y="290" width="700" height="${rows*105+60}" fill="#1f2638"/>${w}<rect x="460" y="${330+rows*105-20}" width="160" height="70" fill="#0c0f18"/>
   <rect y="${330+rows*105+40}" width="1080" height="800" fill="#0b0d14"/>`;
 },
 stairwell(sc,lt,T){
  const fl=0.55+0.45*Math.max(0,Math.sign(noise(T*1.3)+0.6))*(0.8+0.2*noise(T*9));
  const open=sc.openDoor?ease(lt/1.2):0;
  return `<rect width="1080" height="1920" fill="#2a3b34"/><rect y="700" width="1080" height="1220" fill="#1c2a25"/><rect y="690" width="1080" height="14" fill="#11201a"/>
   <rect x="120" y="420" width="300" height="760" fill="#3a2a22" stroke="#141010" stroke-width="10"/><rect x="380" y="780" width="18" height="40" rx="6" fill="#b89b5e"/>
   <rect x="660" y="420" width="300" height="760" fill="#0a0806"/><rect x="660" y="420" width="${300*(1-open*0.75)}" height="760" fill="#3d2c24" stroke="#141010" stroke-width="10"/>
   ${open?`<polygon points="660,1180 960,1180 1080,1400 560,1400" fill="#ffe2a8" opacity="${0.25*open}"/>`:''}
   <text x="270" y="390" text-anchor="middle" font-family="Inter" font-weight="800" font-size="40" fill="#8fa39a">${esc(sc.doors?.[0]||'')}</text>
   <text x="810" y="390" text-anchor="middle" font-family="Inter" font-weight="800" font-size="40" fill="#8fa39a">${esc(sc.doors?.[1]||'')}</text>
   <rect y="1180" width="1080" height="740" fill="#16130f"/>
   <line x1="540" y1="0" x2="540" y2="170" stroke="#111" stroke-width="6"/><circle cx="540" cy="200" r="40" fill="#ffe9b0" opacity="${fl}"/>
   <polygon points="500,220 580,220 1000,1180 80,1180" fill="#fff3c4" opacity="${0.12*fl}"/>`;
 },
 door(sc,lt,T){
  const knocks=(sc.knocks||[]).map(k=>k+sc.start);let shake=0,tuk='';
  for(const k of knocks){const d=T-k;if(d>=0&&d<0.35){shake=Math.sin(d*90)*10*(1-d/0.35);tuk=`<text x="${540+(k*97%200-100)}" y="${560+(k*53%120)}" text-anchor="middle" font-family="Inter" font-weight="900" font-size="120" fill="#e5484d" opacity="${1-d/0.35}" transform="rotate(${k*37%20-10} 540 560)">ТУК</text>`}}
  return `<rect width="1080" height="1920" fill="#14110e"/><g transform="translate(${shake} 0)">
   <rect x="190" y="200" width="700" height="1150" rx="8" fill="#4a3428" stroke="#0b0907" stroke-width="16"/>
   <rect x="250" y="270" width="580" height="1010" rx="6" fill="none" stroke="#3a281f" stroke-width="10"/>
   <circle cx="540" cy="520" r="26" fill="#0b0b0b" stroke="#b89b5e" stroke-width="8"/>
   <rect x="470" y="380" width="140" height="60" rx="6" fill="#b89b5e"/><text x="540" y="425" text-anchor="middle" font-family="Inter" font-weight="800" font-size="40" fill="#2a1d14">${esc(sc.num||'')}</text>
   <rect x="770" y="760" width="26" height="90" rx="8" fill="#b89b5e"/></g>${tuk}
   <rect x="190" y="1350" width="700" height="${sc.lightUnder?16:0}" fill="#ffd27a" opacity="${0.6+0.4*noise(T)}"/>
   <rect y="1366" width="1080" height="560" fill="#0d0b09"/>`;
 },
 peephole(sc,lt,T){
  const sil=sc.silhouette?`<g transform="translate(540 1230) scale(${1.2+0.15*ease(lt/3)})">${person({x:0,dark:true,eyes:sc.eyes},lt,T,0)}</g>`:'';
  const fl=0.6+0.4*Math.abs(noise(T*1.1));
  return `<rect width="1080" height="1920" fill="#000"/><defs><clipPath id="ph"><circle cx="540" cy="900" r="460"/></clipPath>
   <radialGradient id="fe" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".95"/></radialGradient></defs>
   <g clip-path="url(#ph)"><rect x="80" y="440" width="920" height="920" fill="#2a3b34"/><rect x="80" y="900" width="920" height="460" fill="#1c2a25"/>
   <rect x="80" y="1180" width="920" height="200" fill="#16130f"/><circle cx="540" cy="520" r="34" fill="#ffe9b0" opacity="${fl}"/>
   <polygon points="510,540 570,540 900,1200 180,1200" fill="#fff3c4" opacity="${0.12*fl}"/>${sil}
   <circle cx="540" cy="900" r="460" fill="url(#fe)"/></g><circle cx="540" cy="900" r="462" fill="none" stroke="#111" stroke-width="12"/>`;
 },
 room(sc,lt,T){
  const fl=sc.phoneGlow?0.5+0.2*noise(T):0;
  return `<rect width="1080" height="1920" fill="#10131f"/><rect x="620" y="300" width="300" height="400" fill="#0a0d1a" stroke="#2a3050" stroke-width="16"/>
   <circle cx="820" cy="400" r="40" fill="#cfd3e6" opacity=".7"/><rect y="1250" width="1080" height="670" fill="#1a1622"/>
   <rect x="80" y="1020" width="520" height="230" rx="20" fill="#2b2f4a"/><rect x="80" y="960" width="160" height="90" rx="30" fill="#c9cde0"/>
   ${person({...sc.items?.[0],x:sc.items?.[0]?.x??760},lt,T,1250)}
   ${fl?`<circle cx="${(sc.items?.[0]?.x??760)+60}" cy="900" r="160" fill="#9fb8ff" opacity="${fl*0.35}"/>`:''}`;
 },
 phone(sc,lt,T){
  let y=520, msgs='';
  for(const m of sc.msgs||[]){const at=sc.start+(m.at||0);if(T<at)continue;const a=ease((T-at)/0.25);
   const lines=wrap(m.text,24);const h=70+lines.length*52;const me=m.me;
   const bx=me?980-560:120;
   msgs+=`<g opacity="${a}" transform="translate(0 ${(1-a)*30})"><rect x="${bx}" y="${y}" width="560" height="${h}" rx="26" fill="${me?'#2b5bd7':(m.red?'#3a1517':'#20232e')}"/>
    <text x="${bx+28}" y="${y+46}" font-family="Inter" font-weight="800" font-size="30" fill="${m.red?'#ff6b6b':'#8ab4ff'}">${esc(m.from||'')}</text>
    ${lines.map((l,i)=>`<text x="${bx+28}" y="${y+98+i*52}" font-family="Inter" font-weight="500" font-size="40" fill="#f1f1f4">${esc(l)}</text>`).join('')}</g>`;
   y+=h+26;}
  const typing=sc.typing&&Math.floor(T*2)%2?'печатает…':'';
  return `<rect width="1080" height="1920" fill="#06070b"/><rect x="70" y="200" width="940" height="1260" rx="70" fill="#0e1016" stroke="#2a2d38" stroke-width="10"/>
   <text x="140" y="290" font-family="Inter" font-weight="700" font-size="34" fill="#c9ccd6">${esc(sc.clock||'3:07')}</text>
   <rect x="70" y="320" width="940" height="140" fill="#151823"/><circle cx="170" cy="390" r="44" fill="#2b5bd7"/><text x="170" y="404" text-anchor="middle" font-family="Inter" font-weight="800" font-size="36" fill="#fff">П</text>
   <text x="240" y="380" font-family="Inter" font-weight="800" font-size="38" fill="#fff">${esc(sc.chat||'Подъезд 2 · дом 14')}</text>
   <text x="240" y="426" font-family="Inter" font-size="30" fill="#8a8fa0">${esc(sc.members||'')} ${typing}</text>${msgs}`;
 },
 note(sc,lt,T){
  const a=ease(lt/0.5);const lines=wrap(sc.note||'',16);
  return `<rect width="1080" height="1920" fill="#17120d"/><rect y="1300" width="1080" height="620" fill="#0f0c09"/>
   <g transform="translate(540 820) rotate(${-4+2*a}) scale(${0.9+0.1*a})"><rect x="-340" y="-300" width="680" height="600" fill="#efe6cf"/>
   ${[...Array(9)].map((_,i)=>`<line x1="-300" y1="${-200+i*60}" x2="300" y2="${-200+i*60}" stroke="#c9d6e8" stroke-width="3"/>`).join('')}
   ${lines.map((l,i)=>`<text x="0" y="${-90+i*90-(lines.length-1)*40}" text-anchor="middle" font-family="DejaVu Serif,serif" font-style="italic" font-size="70" fill="#2a2a3a">${esc(l)}</text>`).join('')}</g>`;
 },
 lift(sc,lt,T){
  const fl=0.7+0.3*Math.abs(noise(T*1.5));
  return `<rect width="1080" height="1920" fill="#1b1d22"/><rect x="200" y="260" width="680" height="1180" rx="20" fill="#7c8088"/><rect x="230" y="290" width="620" height="1120" fill="#5d6169"/>
   <rect x="380" y="380" width="320" height="170" rx="12" fill="#0b0b0b"/><text x="540" y="505" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-weight="700" font-size="130" fill="#ff3b30" opacity="${fl}">${esc(sc.floorSeq?sc.floorSeq.filter(f=>f[0]<=lt).at(-1)[1]:(sc.floor??''))}</text>
   ${[1,2,3,4,5,6,7,8,9].map((n,i)=>{const cx=430+(i%3)*110,cy=680+Math.floor(i/3)*130;const on=n==sc.pressed;return `<circle cx="${cx}" cy="${cy}" r="44" fill="${on?'#ffd23f':'#c4c7cc'}" stroke="#3a3c42" stroke-width="6"/><text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="Inter" font-weight="800" font-size="44" fill="#222">${n}</text>`}).join('')}
   <rect y="1440" width="1080" height="480" fill="#111215"/>`;
 }
};
function wrap(t,n){const w=t.split(' '),out=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>n){out.push(cur.trim());cur=x}else cur+=' '+x}if(cur.trim())out.push(cur.trim());return out}

let TL=null;
window.setTimeline=tl=>{TL=tl;document.getElementById('label').textContent=tl.series};
window.render=T=>{
 const idx=Math.max(0,TL.scenes.findIndex(s=>T>=s.start&&T<s.end));const sc=TL.scenes[T>=TL.scenes.at(-1).end?TL.scenes.length-1:idx];
 const lt=T-sc.start,dur=sc.end-sc.start;
 const z=1+0.06*lt/dur+0.03*(1-ease(lt/0.35));
 let g=(SC[sc.bg]||SC.stairwell)(sc,lt,T);
 if(sc.bg!=='room')for(const it of sc.items||[])if(it.t==='person')g+=person(it,lt,T,it.floor||1180);
 const fade=Math.min(1,lt/0.18);
 document.getElementById('svg').innerHTML=`${VIGNETTE}<g opacity="${fade}" transform="translate(540 900) scale(${z}) translate(-540 -900)">${g}</g><rect width="1080" height="1920" fill="url(#vg)"/>`;
 const w=sc.words,i=Math.max(0,w.findLastIndex(x=>x.start<=T));const c0=Math.floor(i/3)*3,chunk=w.slice(c0,c0+3);
 const acc=new Set((sc.accent||[]).map(a=>a.toLowerCase()));
 document.getElementById('cap').innerHTML=chunk.map(x=>{const cl=x.w.toLowerCase().replace(/[.,!?:;«»—]/g,'');return `<span class="${acc.has(cl)?'acc':''}">${esc(x.w.replace(/[,;.:]$/,''))}</span>`}).join(' ');
 document.getElementById('cap').style.transform=`scale(${1+0.08*(1-ease((T-w[c0].start)/0.12))})`;
 document.getElementById('bar').style.width=(T/TL.duration*1080)+'px';
};
</script></body></html>
