<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden}
svg{position:absolute;inset:0}
#label{position:absolute;top:70px;left:60px;background:rgba(10,12,24,.75);color:#fff;font:800 40px/1 "Inter";letter-spacing:.08em;padding:18px 24px;border-radius:12px}
#label b{color:#7fb6ff;font-weight:700}
#cap{position:absolute;left:60px;right:60px;top:1420px;text-align:center;font:900 92px/1.08 "Inter";text-transform:uppercase;color:#fff;
 paint-order:stroke fill;-webkit-text-stroke:14px #0b0b14;letter-spacing:-.01em}
#cap span{display:inline-block;margin:0 .14em}
#cap .acc{color:#ffd23f}
#bar{position:absolute;left:0;bottom:0;height:10px;background:#ffd23f}
</style></head>
<body><div id="stage"><svg id="svg" viewBox="0 0 1080 1920"></svg><div id="label"></div><div id="cap"></div><div id="bar"></div></div>
<script>
const FLOOR=1250;
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const BG={
 night:()=>`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f3b"/><stop offset="1" stop-color="#2c3160"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#g)"/><rect x="640" y="300" width="300" height="380" rx="10" fill="#0e1130" stroke="#4a4f80" stroke-width="16"/>
  <circle cx="830" cy="400" r="46" fill="#f4f1d0"/><line x1="790" y1="300" x2="790" y2="680" stroke="#4a4f80" stroke-width="12"/>
  <rect y="${FLOOR}" width="1080" height="${1920-FLOOR}" fill="#3a2f45"/>`,
 kitchen:()=>`<rect width="1080" height="1920" fill="#f3e3c7"/><rect y="760" width="1080" height="12" fill="#e2c9a3"/>
  <rect x="90" y="300" width="260" height="300" rx="12" fill="#bfe3f2" stroke="#fff" stroke-width="18"/><rect x="760" y="380" width="200" height="140" rx="10" fill="#d97a5b"/>
  <rect y="${FLOOR}" width="1080" height="${1920-FLOOR}" fill="#b98a5e"/>`,
 school:()=>`<rect width="1080" height="1920" fill="#d8ecd8"/><rect x="150" y="300" width="780" height="380" rx="14" fill="#2f5a46" stroke="#a0784f" stroke-width="20"/>
  <text x="540" y="510" text-anchor="middle" font-family="Inter" font-size="64" fill="#e8f0e8" font-weight="700">2 + 2 = 4</text>
  <rect y="${FLOOR}" width="1080" height="${1920-FLOOR}" fill="#8f9fb0"/>`,
 yard:()=>`<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f5"/><stop offset="1" stop-color="#d6efff"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#s)"/><rect x="60" y="560" width="420" height="700" fill="#e8b28a"/>
  ${[0,1,2].map(r=>[0,1,2].map(c=>`<rect x="${100+c*130}" y="${620+r*180}" width="90" height="120" fill="#fff6e8"/>`).join('')).join('')}
  <rect y="${FLOOR}" width="1080" height="${1920-FLOOR}" fill="#7bb661"/>`
};
function sun(t){const r=10*Math.sin(t*2);return `<g transform="translate(880 260) rotate(${t*20})">${[...Array(12)].map((_,i)=>`<rect x="-6" y="-${150+r}" width="12" height="40" rx="6" fill="#ffd23f" transform="rotate(${i*30})"/>`).join('')}<circle r="95" fill="#ffd23f"/></g>`}
function table(x){return `<rect x="${x-170}" y="${FLOOR-230}" width="340" height="28" rx="8" fill="#8a5a3b"/><rect x="${x-150}" y="${FLOOR-202}" width="20" height="202" fill="#7a4c30"/><rect x="${x+130}" y="${FLOOR-202}" width="20" height="202" fill="#7a4c30"/><rect x="${x-40}" y="${FLOOR-266}" width="80" height="36" rx="6" fill="#fff"/>`}
function face(mood,blink){
 const ey=blink?`<rect x="-46" y="-12" width="30" height="5" fill="#222"/><rect x="16" y="-12" width="30" height="5" fill="#222"/>`:
  `<ellipse cx="-31" cy="-10" rx="20" ry="${mood==='shock'?26:22}" fill="#fff" stroke="#222" stroke-width="4"/><ellipse cx="31" cy="-10" rx="20" ry="${mood==='shock'?26:22}" fill="#fff" stroke="#222" stroke-width="4"/>
   <circle cx="-28" cy="-6" r="${mood==='shock'?6:9}" fill="#222"/><circle cx="34" cy="-6" r="${mood==='shock'?6:9}" fill="#222"/>`;
 const brows={worried:`<path d="M-50 -46 L-14 -38 M50 -46 L14 -38" stroke="#222" stroke-width="6" stroke-linecap="round"/>`,
  angry:`<path d="M-50 -46 L-14 -32 M50 -46 L14 -32" stroke="#222" stroke-width="7" stroke-linecap="round"/>`}[mood]||'';
 const mouth={calm:`<path d="M-18 40 Q0 50 18 40" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  smile:`<path d="M-30 34 Q0 62 30 34" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  worried:`<path d="M-18 48 Q0 38 18 48" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`,
  shock:`<ellipse cx="0" cy="46" rx="14" ry="18" fill="#5a1d1d"/>`,
  angry:`<path d="M-22 48 L22 48" stroke="#222" stroke-width="6" stroke-linecap="round"/>`}[mood];
 return ey+brows+mouth;
}
function person(p,lt,T){
 const s=p.scale||1, bob=Math.sin(T*3+p.x)*4, x=p.x+(p.walk?lt*260:0);
 let sh=p.shadow?1:(p.fade?1-ease(lt/0.9):0);
 const blink=((T+p.x/300)%3.2)<0.12;
 const hair=p.hair==='long'?`<path d="M-80 -20 Q-90 -110 0 -112 Q90 -110 80 -20 L84 90 L56 90 L58 -40 Q0 -70 -58 -40 L-56 90 L-84 90Z" fill="#5a3825"/>`
   :`<path d="M-78 -30 Q-80 -110 0 -110 Q80 -110 78 -30 Q40 -70 -78 -30Z" fill="#2b2b33"/>`;
 const glasses=p.glasses?`<g fill="none" stroke="#111" stroke-width="6"><circle cx="-31" cy="-10" r="28"/><circle cx="31" cy="-10" r="28"/><path d="M-3 -10 L3 -10"/></g>`:'';
 return `<g transform="translate(${x} ${FLOOR}) scale(${s})">
  <ellipse cx="70" cy="6" rx="150" ry="22" fill="#000" opacity="${0.32*sh}" transform="skewX(-35)"/>
  <rect x="-48" y="-200" width="38" height="200" rx="16" fill="#2d3550"/><rect x="10" y="-200" width="38" height="200" rx="16" fill="#2d3550"/>
  <g transform="translate(0 ${bob})">
   <rect x="-80" y="-430" width="160" height="250" rx="50" fill="${p.shirt}"/>
   <rect x="-112" y="-410" width="40" height="190" rx="20" fill="${p.shirt}"/><rect x="72" y="-410" width="40" height="190" rx="20" fill="${p.shirt}"/>
   <g transform="translate(0 -540)"><circle r="96" fill="#f6d2b5"/>${hair}${face(p.mood,blink)}${glasses}</g>
  </g></g>`;
}
let TL=null;
window.setTimeline=tl=>{TL=tl;document.getElementById('label').innerHTML=tl.series.replace(' · ',' · <b>')+'</b>'};
window.render=T=>{
 const sc=TL.scenes.find(s=>T>=s.start&&T<s.end)||TL.scenes[TL.scenes.length-1];
 const lt=T-sc.start, dur=sc.end-sc.start;
 let z=1+0.03*(1-ease(lt/0.4));
 if(sc.items.some(i=>i.zoom)) z+=0.12*lt/dur;
 let g=BG[sc.bg]();
 for(const it of sc.items){if(it.t==='sun')g+=sun(T);else if(it.t==='table')g+=table(it.x);}
 for(const it of sc.items) if(it.t==='person') g+=person(it,lt,T);
 document.getElementById('svg').innerHTML=`<g transform="translate(540 960) scale(${z}) translate(-540 -960)">${g}</g>`;
 // captions: chunks of up to 3 words
 const w=sc.words, i=Math.max(0,w.findLastIndex(x=>x.start<=T));
 const c0=Math.floor(i/3)*3, chunk=w.slice(c0,c0+3);
 const acc=new Set((sc.accent||[]).map(a=>a.toLowerCase()));
 document.getElementById('cap').innerHTML=chunk.map(x=>{const clean=x.w.toLowerCase().replace(/[.,!?:;«»]/g,'');return `<span class="${acc.has(clean)?'acc':''}">${x.w.replace(/[,;.:]$/,'')}</span>`}).join(' ');
 const pop=1+0.08*(1-ease((T-w[c0].start)/0.12));
 document.getElementById('cap').style.transform=`scale(${pop})`;
 document.getElementById('bar').style.width=(T/TL.duration*1080)+'px';
};
</script></body></html>
